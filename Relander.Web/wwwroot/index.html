<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Relander</title>
    <style>
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-family: monospace;
            color: #ccc;
            margin: 24px;
        }
        canvas { image-rendering: pixelated; background: #000; }
        .hint { font-size: 13px; }
        .hint b { color: #fff; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div class="hint">
        <b>A/D</b> yaw &nbsp; <b>W/S</b> pitch &nbsp; <b>M</b> thrust &nbsp; <b>H</b> hover &nbsp; <b>N</b> fire
        &nbsp; <b>P</b> position/landing panel &nbsp; <b>Tab/R</b> map &nbsp; <b>Esc</b> new game
        &nbsp;·&nbsp; <a href="?widescreen=1" style="color:#8cf">widescreen</a>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
