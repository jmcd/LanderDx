name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Run the test suite
        run: dotnet test LanderDx.Tests/LanderDx.Tests.csproj

      - name: Publish the web bundle
        run: dotnet publish LanderDx.Web/LanderDx.Web.csproj -c Release

      - name: Smoke-test the bundle under Node
        run: node smoke.mjs
        working-directory: LanderDx.Web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: LanderDx.Web/bin/Release/net10.0/browser-wasm/AppBundle

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
